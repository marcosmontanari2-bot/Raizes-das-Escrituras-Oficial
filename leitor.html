<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitura Bíblica | Raízes das Escrituras</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
    
    <style>
        body {
            background-color: #f1f5f9;
            padding-top: 70px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .leitor-wrapper {
            max-width: 800px;
            margin: 20px auto 60px auto;
            background: #ffffff;
            padding: 50px 60px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
        }
        
        .btn-voltar-leitor {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #64748b;
            font-weight: 600;
            background: transparent;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            transition: all 0.2s ease;
            margin-bottom: 40px;
            font-size: 0.95rem;
        }
        
        .btn-voltar-leitor:hover {
            background: #f8fafc;
            color: #1e293b;
            border-color: #94a3b8;
        }
        
        .titulo-livro {
            color: #1e293b;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.4rem;
            font-weight: 800;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        
        .texto-biblico {
            font-size: 1.3rem;
            line-height: 1.9;
            color: #334155;
            text-align: justify;
            font-family: Georgia, 'Times New Roman', Times, serif;
            margin-bottom: 50px;
        }
        
        .texto-biblico sup {
            color: #059669;
            font-weight: 800;
            font-size: 0.85rem;
            margin-right: 6px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        .caixa-estudo {
            background: linear-gradient(to right, #f8fafc, #ffffff);
            border-left: 4px solid #059669;
            padding: 30px 40px;
            border-radius: 0 12px 12px 0;
            margin-top: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border-top: 1px solid #f1f5f9;
            border-right: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;
        }
        
        .caixa-estudo h3 {
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        .caixa-estudo p {
            margin-bottom: 18px;
            font-size: 1.05rem;
            color: #475569;
            line-height: 1.8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        .caixa-estudo strong {
            color: #0f172a;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 4px;
        }
        
        .capitulo-container {
            margin-bottom: 80px;
        }

        .divisoria {
            height: 1px;
            background: #e2e8f0;
            margin: 60px 0;
            border: none;
        }
        
        @media (max-width: 600px) {
            .leitor-wrapper { padding: 30px 20px; margin: 15px; border-radius: 12px; }
            .titulo-livro { font-size: 1.8rem; margin-bottom: 25px; }
            .texto-biblico { font-size: 1.15rem; line-height: 1.7; }
            .caixa-estudo { padding: 20px; border-radius: 0 8px 8px 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="cabecalho-centralizado">
            <h1>📖 Raízes das Escrituras</h1>
        </div>
    </header>

    <main>
        <div class="leitor-wrapper">
            
            <a href="#" onclick="voltarPagina(event)" class="btn-voltar-leitor">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Voltar para o Plano
            </a>
            
            <div id="conteudo-leitura">
                <div style="text-align: center; padding: 50px 0;">
                    <h2 style="color: #64748b; font-weight: normal;">Preparando o texto bíblico...</h2>
                </div>
            </div>
            
        </div>
    </main>

    <footer>
        <div class="rodape-container">
            <div class="rodape-texto">
                <p>&copy; 2026 Raízes das Escrituras. Todos os direitos reservados.</p>
                <p><em>"Lâmpada para os meus pés é tua palavra, e luz para o meu caminho." - Salmos 119:105</em></p>
            </div>
        </div>
    </footer>

    <script>
        function voltarPagina(e) {
            e.preventDefault();
            if (window.opener !== null) {
                window.close(); 
                setTimeout(() => { window.location.href = 'indice-leitura.html'; }, 300);
            } else if (window.history.length > 1) {
                window.history.back(); 
            } else {
                window.location.href = 'indice-leitura.html';
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        let livro = urlParams.get('livro'); 
        const capitulos = urlParams.get('capitulos');

        if (!livro || !capitulos) {
            document.getElementById('conteudo-leitura').innerHTML = '<h2 style="color: #b91c1c; text-align: center;">Erro: Nenhum livro selecionado.</h2>';
        } else {
            
            const correcoesDeNome = {
                '1timoteo': 'timoteo1',
                '2timoteo': 'timoteo2',
                '1pedro': 'pedro1',
                '2pedro': 'pedro2',
                '1joao': 'joao1',
                '2joao': 'joao2',
                '3joao': 'joao3',
                '1tessalonicenses': 'tessalonicenses1',
                '2tessalonicenses': 'tessalonicenses2'
            };

            if (correcoesDeNome[livro.toLowerCase()]) {
                livro = correcoesDeNome[livro.toLowerCase()];
            }

            const livrosNovoTestamento = ['mateus', 'marcos', 'lucas', 'joao', 'atos', 'romanos', '1corintios', '2corintios', 'galatas', 'efesios', 'filipenses', 'colossenses', 'tessalonicenses1', 'tessalonicenses2', 'timoteo1', 'timoteo2', 'tito', 'filemom', 'hebreus', 'tiago', 'pedro1', 'pedro2', 'joao1', 'joao2', 'joao3', 'judas', 'apocalipse'];

            const pasta = livrosNovoTestamento.includes(livro.toLowerCase()) ? 'novo-testamento' : 'antigo-testamento';
            const caminhoJson = `dados/linguagem-simples/${pasta}/${livro}.json`;

            fetch(caminhoJson)
                .then(resposta => {
                    if (!resposta.ok) throw new Error("Arquivo JSON não encontrado");
                    return resposta.json();
                })
                .then(dados => {
                    const container = document.getElementById('conteudo-leitura');
                    let htmlFinal = "";

                    let capInicio = 1, capFim = 1;
                    if(capitulos.includes('-')) {
                        const partes = capitulos.split('-');
                        capInicio = parseInt(partes[0]);
                        capFim = parseInt(partes[1]);
                    } else {
                        capInicio = parseInt(capitulos);
                        capFim = parseInt(capitulos);
                    }

                    for(let i = capInicio; i <= capFim; i++) {
                        const capData = dados[i.toString()];
                        
                        if(capData) {
                            htmlFinal += `
                            <div class="capitulo-container">
                                <h1 class="titulo-livro">${capData.referencia}</h1>
                                <div class="texto-biblico">${capData.texto}</div>
                                
                                <div class="caixa-estudo">
                                    <h3>💡 Estudo e Reflexão</h3>
                                    <p><strong>Contexto:</strong><br> ${capData.contexto}</p>
                                    <p><strong>Sentido:</strong><br> ${capData.sentido}</p>
                                    <p><strong>Essência:</strong><br> ${capData.essencia}</p>
                                    <p><strong>O que não diz:</strong><br> ${capData.o_que_nao_diz}</p>
                                </div>
                            </div>`;
                            
                            if (i !== capFim) {
                                htmlFinal += `<hr class="divisoria">`;
                            }
                        }
                    }

                    if (htmlFinal === "") {
                        htmlFinal = '<h2 style="color: #b91c1c; text-align: center;">Capítulos não encontrados no arquivo.</h2>';
                    }
                    
                    container.innerHTML = htmlFinal;
                })
                .catch(erro => {
                    document.getElementById('conteudo-leitura').innerHTML = `
                        <div style="text-align: center; padding: 40px 0;">
                            <h2 style="color: #b91c1c;">Erro ao carregar o texto bíblico.</h2>
                            <p style="color: #64748b; margin-top: 15px; font-size: 1.1rem;">Verifique se o arquivo <b>${livro}.json</b> está salvo corretamente na pasta correspondente.</p>
                        </div>
                    `;
                    console.error(erro);
                });
        }
    </script>
<script src="ui-config.js"></script>
</body>
</html>
